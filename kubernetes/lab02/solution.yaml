apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: taskflow
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: taskflow
  DB_NAME: taskflow
  JWT_EXPIRES_IN: 24h
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taskflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-in-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: taskflow
type: Opaque
stringData:
  DB_PASSWORD: change-me-in-prod
  JWT_SECRET: change-me-generate-a-random-64-char-string
