# Dependabot : PRs automatiques de mise à jour des dépendances vulnérables ou obsolètes.
# Complète npm audit (qui bloque le CI) par une remédiation proactive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Les sauts de version majeurs se font volontairement, pas par bot
      # (les correctifs de sécurité et mises à jour mineures restent proposés)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
