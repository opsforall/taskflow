# ==============================================================================
# PIPELINE CI DevSecOps (version PERMISSIVE) - pour le DEBUT de module
# ==============================================================================
# Meme pipeline que ci.yml, mais les scans de securite (Semgrep, Trivy) sont en
# `continue-on-error: true` : les alertes S'AFFICHENT mais ne BLOQUENT PAS.
# Objectif pedagogique : montrer ce que chaque outil detecte, sans decourager,
# AVANT de basculer sur ci.yml (gates bloquantes). Le passage permissif -> bloquant
# est le moment cle du cours.
#
# Declenchement MANUEL (workflow_dispatch) pour ne pas tourner en double avec
# ci.yml. Depuis l'onglet Actions de GitHub : "Run workflow".
#
# Les commentaires detailles (architecture fan-out/fan-in, SCA vs SAST, etc.)
# sont dans ci.yml ; ici on se concentre sur la difference : les gates sont molles.
# ------------------------------------------------------------------------------

name: CI (permissive)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - name: Install + lint
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run lint
          npm run format:check

  test:
    name: test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - name: Install + tests + couverture
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run test:coverage

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  sca:
    name: sca (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      # continue-on-error : l'alerte s'affiche mais ne bloque pas (mode permissif)
      - name: Trivy fs (dependances)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.component }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  sast:
    name: sast (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        continue-on-error: true # mode permissif
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --config p/javascript --config p/nodejs --config p/react \
              --error --metrics off \
              ${{ matrix.component }}/src

  iac-scan:
    name: iac-scan (manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (manifests k8s)
        continue-on-error: true # mode permissif
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
