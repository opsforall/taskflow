# Pipeline CI DevSecOps — étapes successives (chaînées par `needs:`)
#
# 1 · Lint      → ESLint + Prettier (backend + frontend) ....... « fail fast » sur le style
# 2 · Test      → Jest + Supertest / Vitest, couverture ≥ 60%
# 3 · Secrets   → Gitleaks (secrets committés dans l'historique)
# 4 · SCA       → Trivy fs (vulnérabilités des DÉPENDANCES)
# 5 · SAST      → Semgrep (vulnérabilités du CODE applicatif)
# 6 · Image     → build Docker → Trivy image → push GHCR (push main uniquement)
#
# SCA (étape 4) ≠ SAST (étape 5) : la SCA analyse les bibliothèques tierces
# (ce que tu importes), le SAST analyse ton propre code source.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1 · LINT — rapide, casse tout de suite si le code est « sale »
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 1 · Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Backend — install + ESLint + Prettier
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run format:check

      - name: Frontend — install + ESLint + Prettier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check

  # ─────────────────────────────────────────────────────────────
  # 2 · TESTS UNITAIRES + couverture (seuil 60% défini côté projet)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 2 · Tests unitaires + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Backend — Jest + Supertest (couverture ≥ 60%)
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage

      - name: Frontend — Vitest (couverture ≥ 60%)
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

  # ─────────────────────────────────────────────────────────────
  # 3 · SECRET SCANNING — binaire Gitleaks (open-source, sans licence)
  # ─────────────────────────────────────────────────────────────
  secrets:
    name: 3 · Secret scanning (Gitleaks)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks analyse tout l'historique git

      # On utilise le binaire directement plutôt que l'action gitleaks/gitleaks-action,
      # qui exige une licence payante sur les dépôts d'organisation. Sort en code 1
      # si un secret est trouvé.
      - name: Scan Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  # ─────────────────────────────────────────────────────────────
  # 4 · SCA — Trivy en mode filesystem : vulnérabilités des dépendances
  #     (lit les package-lock.json, aucune install nécessaire)
  # ─────────────────────────────────────────────────────────────
  sca:
    name: 4 · SCA — dépendances (Trivy fs)
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs — scan des dépendances
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ─────────────────────────────────────────────────────────────
  # 5 · SAST — Semgrep sur le CODE applicatif (backend + frontend)
  #     Règles lisibles en YAML ; on cible src/ (pas l'IaC k8s).
  # ─────────────────────────────────────────────────────────────
  sast:
    name: 5 · SAST — code (Semgrep)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Image officielle Semgrep ; --error => sortie non nulle si findings
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --config p/javascript --config p/nodejs --config p/react \
              --error --metrics off \
              backend/src backend/tests frontend/src

  # ─────────────────────────────────────────────────────────────
  # 6 · IMAGE — build → Trivy image (OS + deps) → push GHCR
  # ─────────────────────────────────────────────────────────────
  image:
    name: 6 · Image ${{ matrix.service }} (build + Trivy)
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push vers GitHub Container Registry
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (load: true) : l'image n'est PAS poussée avant d'être scannée
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push uniquement sur main (le build est en cache, cette étape est instantanée)
      - name: Push vers GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
