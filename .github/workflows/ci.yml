# Pipeline CI DevSecOps
#
# ┌ tests unitaires backend (Jest + Supertest) + npm audit (SCA)
# ├ tests + build frontend (Vitest + Vite) + npm audit (SCA)
# ├ Gitleaks : détection de secrets committés dans l'historique git
# ├ CodeQL : analyse statique du code (SAST)
# └ pour chaque image (backend, frontend) :
#     build Docker → scan Trivy (vulnérabilités HIGH/CRITICAL bloquantes)
#     → push vers GHCR (uniquement sur push main, jamais sur les PR)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend · tests unitaires + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires (Jest + Supertest)
        run: npm test

      # SCA : bloque le pipeline si une dépendance de production a une
      # vulnérabilité HIGH ou CRITICAL connue (--omit=dev : seules les
      # dépendances embarquées dans l'image de prod sont contrôlées)
      - name: Audit des dépendances (npm audit)
        run: npm audit --omit=dev --audit-level=high

  frontend-test:
    name: Frontend · tests + build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build de production (Vite)
        run: npm run build

      - name: Audit des dépendances (npm audit)
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Gitleaks · détection de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          # Gitleaks analyse tout l'historique git, pas seulement le dernier commit
          fetch-depth: 0

      - name: Scan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL · analyse statique (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # nécessaire pour publier les résultats dans l'onglet Security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v3

  docker:
    name: Image ${{ matrix.service }} · build + Trivy + push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
      packages: write # push vers GitHub Container Registry
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build local (load: true) : l'image n'est PAS poussée avant d'être scannée
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Scan de l'image : vulnérabilités OS + dépendances applicatives.
      # exit-code 1 => le job échoue si une CVE HIGH/CRITICAL corrigeable est trouvée
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push uniquement sur main (le build est en cache, cette étape est instantanée)
      - name: Push vers GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
