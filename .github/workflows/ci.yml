# Pipeline CI DevSecOps — étapes successives (chaînées par `needs:`)
#
# 1 · Lint         → ESLint + Prettier (backend + frontend) ..... « fail fast » sur le style
# 2 · Test unit.   → Jest + Supertest / Vitest, couverture ≥ 60% (base MOCKÉE)
# 3 · Intégration  → API testée contre une VRAIE PostgreSQL (service éphémère)
# 4 · Secrets      → Gitleaks (secrets committés dans l'historique)
# 5 · SCA          → Trivy fs (vulnérabilités des DÉPENDANCES)
# 6 · SAST         → Semgrep (vulnérabilités du CODE applicatif)
# 7 · Image        → build Docker → Trivy image → push GHCR (push main uniquement)
# 8 · E2E          → Playwright : parcours utilisateur sur la stack DÉPLOYÉE
#
# Plus un test est « proche du produit fini », plus il est tard : unitaire →
# intégration → build → E2E. SCA (étape 5) ≠ SAST (étape 6) : la SCA analyse les
# bibliothèques tierces, le SAST analyse ton propre code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1 · LINT — rapide, casse tout de suite si le code est « sale »
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 1 · Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Backend — install + ESLint + Prettier
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run format:check

      - name: Frontend — install + ESLint + Prettier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check

  # ─────────────────────────────────────────────────────────────
  # 2 · TESTS UNITAIRES + couverture (base de données MOCKÉE)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 2 · Tests unitaires + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Backend — Jest + Supertest (couverture ≥ 60%)
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage

      - name: Frontend — Vitest (couverture ≥ 60%)
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

  # ─────────────────────────────────────────────────────────────
  # 3 · TESTS D'INTÉGRATION — API contre une VRAIE PostgreSQL
  #     (service éphémère fourni par GitHub Actions)
  # ─────────────────────────────────────────────────────────────
  integration:
    name: 3 · Tests d'intégration (API + PostgreSQL)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Backend — tests d'intégration (vraie base)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: taskflow
          DB_PASSWORD: taskflow
          DB_NAME: taskflow
          JWT_SECRET: test-secret-integration
        run: |
          npm ci
          npm run test:integration

  # ─────────────────────────────────────────────────────────────
  # 4 · SECRET SCANNING — binaire Gitleaks (open-source, sans licence)
  # ─────────────────────────────────────────────────────────────
  secrets:
    name: 4 · Secret scanning (Gitleaks)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks analyse tout l'historique git

      # On utilise le binaire directement plutôt que l'action gitleaks/gitleaks-action,
      # qui exige une licence payante sur les dépôts d'organisation. Sort en code 1
      # si un secret est trouvé.
      - name: Scan Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  # ─────────────────────────────────────────────────────────────
  # 5 · SCA — Trivy en mode filesystem : vulnérabilités des dépendances
  #     (lit les package-lock.json, aucune install nécessaire)
  # ─────────────────────────────────────────────────────────────
  sca:
    name: 5 · SCA — dépendances (Trivy fs)
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs — scan des dépendances
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ─────────────────────────────────────────────────────────────
  # 6 · SAST — Semgrep sur le CODE applicatif (backend + frontend)
  #     Règles lisibles en YAML ; on cible src/ (pas l'IaC k8s).
  # ─────────────────────────────────────────────────────────────
  sast:
    name: 6 · SAST — code (Semgrep)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Image officielle Semgrep ; --error => sortie non nulle si findings
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --config p/javascript --config p/nodejs --config p/react \
              --error --metrics off \
              backend/src backend/tests frontend/src

  # ─────────────────────────────────────────────────────────────
  # 7 · IMAGE — build → Trivy image (OS + deps) → push GHCR
  # ─────────────────────────────────────────────────────────────
  image:
    name: 7 · Image ${{ matrix.service }} (build + Trivy)
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push vers GitHub Container Registry
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (load: true) : l'image n'est PAS poussée avant d'être scannée
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push uniquement sur main (le build est en cache, cette étape est instantanée)
      - name: Push vers GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # ─────────────────────────────────────────────────────────────
  # 8 · E2E — Playwright contre la stack complète DÉPLOYÉE via compose
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: 8 · Tests d'acceptance E2E (Playwright)
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Démarrer la stack (docker compose)
        run: docker compose up -d --build

      - name: Attendre que l'application soit prête
        run: |
          for i in $(seq 1 40); do
            back=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health/ready || true)
            front=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$back" = "200" ] && [ "$front" = "200" ]; then echo "Stack prête"; exit 0; fi
            echo "tentative $i/40 — backend=$back frontend=$front"; sleep 3
          done
          echo "La stack n'est pas prête à temps"; docker compose logs; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Installer Playwright + navigateur Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests E2E (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm test

      - name: Logs de la stack (si échec)
        if: failure()
        run: docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
