# ==============================================================================
# PIPELINE DevOps — la base
# ==============================================================================
# 4 jobs, 4 questions, 1 outil par question :
#
#   🧹 Lint      ESLint     mon code respecte-t-il les regles d'ecriture ?
#   🧪 Tests     Jest/Vitest ma logique fonctionne-t-elle ?
#   📊 Qualite   SonarQube  quelle est ma dette technique ?
#   🐳 Build     Docker     l'image se construit-elle ?
#   📦 Registry  GHCR       ou est-elle stockee ?
#
# Enchainement : lint et test partent en parallele, la qualite les attend
# (elle a besoin de leur couverture), le build attend la qualite.
#
#     lint ─┬─► quality ─► build + push
#     test ─┘
#
# Cette pipeline tourne sur les PULL REQUESTS : c'est le retour rapide pendant
# qu'on developpe. La "Pipeline DevSecOps" reprend ces memes 4 jobs et y ajoute
# les tests de securite ; elle tourne a la fusion sur main.
# ------------------------------------------------------------------------------

name: Pipeline DevOps

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # lancement manuel (seul cas ou cette pipeline publie)

# Moindre privilege : lecture seule par defaut, chaque job demande le reste.
permissions:
  contents: read

# Un nouveau push sur la PR annule le run precedent.
concurrency:
  group: devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 🧹 Lint — ESLint -------------------------------------------------------
  # `matrix` decline le meme job une fois par composant : deux machines en
  # parallele, une pour le frontend, une pour le backend.
  lint:
    name: 🧹 Lint — ESLint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # on veut voir les erreurs des DEUX composants
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: 🧹 ESLint — analyse du style et des bonnes pratiques
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run lint

  # --- 🧪 Tests — Jest (backend) / Vitest (frontend) --------------------------
  # Le frontend utilise Vitest, pas Jest : meme facon d'ecrire les tests
  # (describe / it / expect), mais un lanceur different, integre a Vite.
  test:
    name: 🧪 Tests — ${{ matrix.tool }} (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            tool: Jest
          - component: frontend
            tool: Vitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: 🧪 ${{ matrix.tool }} — tests unitaires + couverture
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run test:coverage

      # Chaque job tourne sur une machine NEUVE et vide. Pour transmettre un
      # fichier au job suivant, il faut donc le deposer quelque part : c'est le
      # role des "artefacts". Ici on transmet la couverture a SonarQube.
      - name: Transmettre la couverture au job qualite
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage/lcov.info
          retention-days: 1

  # --- 📊 Qualite — SonarQube -------------------------------------------------
  # SonarQube ne relance rien : il LIT le code et les rapports de couverture,
  # puis attribue une note (bugs, code smells, duplication, couverture).
  quality:
    name: 📊 Qualité — SonarQube
    runs-on: ubuntu-latest
    needs: [lint, test]
    # NON BLOQUANT pour l'instant : la qualite est MESUREE et affichee, mais un
    # mauvais score n'arrete pas la pipeline. On enlevera cette ligne le jour ou
    # l'equipe est prete a rendre le Quality Gate obligatoire.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : Sonar s'en sert pour le "New Code"

      # On recupere les deux rapports deposes par le job "test", a l'endroit
      # exact ou sonar-project.properties les attend.
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: 📊 SonarQube — analyse de la qualite du code
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # --- 🐳 Build — Docker  /  📦 Registry — GHCR -------------------------------
  # Build et push dans le meme job : une image construite sur une machine
  # n'existe pas sur la suivante.
  build:
    name: 🐳 Build — Docker (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write # necessaire pour ecrire dans GHCR
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🐳 Build — Docker
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true # l'image reste locale : on ne publie rien ici
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # On ne PUBLIE jamais depuis une pull request : le build sert a valider
      # avant la fusion. La publication automatique appartient a la pipeline
      # DevSecOps, qui scanne l'image avant de la pousser. Ici, publication
      # possible uniquement en lancement manuel depuis main (demonstration).
      - name: 📦 Registry — connexion a GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token natif, aucun secret a creer

      - name: 📦 Registry — push vers GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
