# ==============================================================================
# PIPELINE DevOps — la base
# ==============================================================================
# 4 jobs, 4 questions, 1 outil par question :
#
#   🧹 Lint      ESLint     mon code respecte-t-il les regles d'ecriture ?
#   🧪 Tests     Jest/Vitest ma logique fonctionne-t-elle ?
#   📊 Qualite   SonarQube  quelle est ma dette technique ?
#   🐳 Build     Docker     l'image se construit-elle ?
#   📦 Registry  GHCR       ou est-elle stockee ?
#
# Enchainement : lint et test partent en parallele, la qualite les attend
# (elle a besoin de leur couverture), le build attend la qualite.
#
#     lint ─┬─► quality ─► build + push
#     test ─┘
#
# Cette pipeline tourne sur les PULL REQUESTS : c'est le retour rapide pendant
# qu'on developpe. La "Pipeline DevSecOps" reprend ces memes 4 jobs et y ajoute
# les tests de securite ; elle tourne a la fusion sur main.
# ------------------------------------------------------------------------------

name: Pipeline DevOps

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # lancement manuel de la porte complete
  # push:
  #   branches: [main]
  # workflow_dispatch: # lancement manuel (seul cas ou cette pipeline publie)

# Moindre privilege : lecture seule par defaut, chaque job demande le reste.
permissions:
  contents: read

# Un nouveau push sur la PR annule le run precedent.
concurrency:
  group: devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 🧹 Lint — ESLint -------------------------------------------------------
  # `matrix` decline le meme job une fois par composant : deux machines en
  # parallele, une pour le frontend, une pour le backend.
  lint:
    name: 🧹 Lint — ESLint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # on veut voir les erreurs des DEUX composants
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: 🧹 ESLint — analyse du style et des bonnes pratiques
        id: eslint
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run lint

      - name: Résumé
        if: always()
        run: |
          if [ "${{ steps.eslint.outcome }}" = "success" ]; then icon="✅"; verdict="Réussi"; else icon="❌"; verdict="Échoué"; fi
          {
            echo "### 🧹 Lint — ESLint (${{ matrix.component }})"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Résultat | ${icon} **${verdict}** |"
            echo "| Question | Mon code respecte-t-il les règles d'écriture ? |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- 🧪 Tests — Jest (backend) / Vitest (frontend) --------------------------
  # Le frontend utilise Vitest, pas Jest : meme facon d'ecrire les tests
  # (describe / it / expect), mais un lanceur different, integre a Vite.
  test:
    name: 🧪 Tests — ${{ matrix.tool }} (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            tool: Jest
          - component: frontend
            tool: Vitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: 🧪 ${{ matrix.tool }} — tests unitaires + couverture
        id: run_tests
        working-directory: ${{ matrix.component }}
        run: |
          npm ci
          npm run test:coverage

      # Chaque job tourne sur une machine NEUVE et vide. Pour transmettre un
      # fichier au job suivant, il faut donc le deposer quelque part : c'est le
      # role des "artefacts". Ici on transmet la couverture a SonarQube.
      - name: Transmettre la couverture au job qualite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage/lcov.info
          retention-days: 1
          if-no-files-found: warn

      - name: Résumé
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then icon="✅"; verdict="Réussi"; else icon="❌"; verdict="Échoué"; fi
          {
            echo "### 🧪 Tests — ${{ matrix.tool }} (${{ matrix.component }})"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Résultat | ${icon} **${verdict}** |"
            echo "| Question | Ma logique fonctionne-t-elle ? |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- 📊 Qualite — SonarQube -------------------------------------------------
  # SonarQube ne relance rien : il LIT le code et les rapports de couverture,
  # puis attribue une note (bugs, code smells, duplication, couverture).
  #
  # ZERO CONFIGURATION : pas de compte a creer, pas de secret a enregistrer.
  # Le job demarre son PROPRE serveur SonarQube en conteneur, genere un token
  # via l'API, analyse, puis le serveur disparait avec le job.
  # Compromis assume : pas de tableau de bord a consulter apres coup — les
  # chiffres cles sont donc publies dans le resume du run (onglet Summary).
  # Pour explorer l'interface en local :
  #   docker run -d -p 9000:9000 -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
  #     sonarqube:26.7.0.124771-community        (puis http://localhost:9000)
  quality:
    name: 📊 Qualité — SonarQube
    runs-on: ubuntu-latest
    needs: [lint, test]
    # NON BLOQUANT pour l'instant : la qualite est MESUREE et affichee, mais un
    # mauvais score n'arrete pas la pipeline. On enlevera cette ligne le jour ou
    # l'equipe est prete a rendre le Quality Gate obligatoire.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : Sonar s'en sert pour dater les problemes

      # On recupere les deux rapports deposes par le job "test", a l'endroit
      # exact ou sonar-project.properties les attend.
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      # Version FIGEE (pas `latest`). SONAR_ES_BOOTSTRAP_CHECKS_DISABLE : le
      # moteur de recherche interne exige un reglage noyau absent des runners ;
      # inutile pour un serveur jetable.
      - name: Demarrer un serveur SonarQube ephemere
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:26.7.0.124771-community

      - name: Attendre que SonarQube soit pret (~1 min)
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$status" = "UP" ]; then echo "SonarQube pret"; exit 0; fi
            echo "tentative $i/60 - status=${status:-demarrage}"; sleep 5
          done
          echo "SonarQube n'a pas demarre a temps"; docker logs sonarqube; exit 1

      # Sur une instance neuve, l'API accepte les identifiants par defaut
      # admin/admin : on s'en sert pour fabriquer le token d'analyse.
      # ::add-mask:: le masque dans les logs (reflexe a garder, meme si ce
      # token ne protege qu'un serveur jetable).
      - name: Generer un token d'analyse
        id: sonar
        run: |
          token=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # qualitygate.wait : le scanner attend le verdict du Quality Gate et
      # sort en erreur s'il est rouge (rendu non bloquant par continue-on-error).
      - name: 📊 SonarQube — analyse de la qualite du code
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: -Dsonar.qualitygate.wait=true

      # Le serveur meurt avec le job : ce resume est la trace qui reste.
      - name: Publier les mesures dans le resume du run
        if: always()
        run: |
          json=$(curl -s -u "${{ steps.sonar.outputs.token }}:" \
            "http://localhost:9000/api/measures/component?component=taskflow&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc")
          get() { echo "$json" | jq -r ".component.measures[] | select(.metric==\"$1\") | .value // \"-\""; }
          gate=$(curl -s -u "${{ steps.sonar.outputs.token }}:" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=taskflow" \
            | jq -r .projectStatus.status)
          {
            echo "### 📊 Qualité — SonarQube"
            echo ""
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            echo "| Quality Gate | **${gate}** |"
            echo "| Bugs | $(get bugs) |"
            echo "| Vulnérabilités | $(get vulnerabilities) |"
            echo "| Code smells | $(get code_smells) |"
            echo "| Couverture | $(get coverage) % |"
            echo "| Duplication | $(get duplicated_lines_density) % |"
            echo "| Lignes de code | $(get ncloc) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- 🐳 Build — Docker  /  📦 Registry — GHCR -------------------------------
  # Build et push dans le meme job : une image construite sur une machine
  # n'existe pas sur la suivante.
  build:
    name: 🐳 Build — Docker (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write # necessaire pour ecrire dans GHCR
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🐳 Build — Docker
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true # l'image reste locale : on ne publie rien ici
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # On ne PUBLIE jamais depuis une pull request : le build sert a valider
      # avant la fusion. La publication automatique appartient a la pipeline
      # DevSecOps, qui scanne l'image avant de la pousser. Ici, publication
      # possible uniquement en lancement manuel depuis main (demonstration).
      - name: 📦 Registry — connexion a GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token natif, aucun secret a creer

      - name: 📦 Registry — push vers GHCR
        id: registry_push
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Résumé
        if: always()
        run: |
          if [ "${{ steps.docker_build.outcome }}" = "success" ]; then build_icon="✅"; build_verdict="Réussi"; else build_icon="❌"; build_verdict="Échoué"; fi
          case "${{ steps.registry_push.outcome }}" in
            success) push="✅ publiée sur GHCR" ;;
            skipped) push="⏭️ non publiée (réservé au lancement manuel depuis main)" ;;
            *) push="❌ échec" ;;
          esac
          {
            echo "### 🐳 Build — Docker (${{ matrix.component }})"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Build | ${build_icon} **${build_verdict}** |"
            echo "| Image | \`${{ env.IMAGE }}:${{ github.sha }}\` |"
            echo "| Publication GHCR | ${push} |"
          } >> "$GITHUB_STEP_SUMMARY"
