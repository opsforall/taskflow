# Secret : le mot de passe de la base ne vit NI dans l'image NI dans un ConfigMap.
#
# ⚠️  En formation on le committe pour la démo, mais en production ce fichier ne
#     doit JAMAIS être dans git : on utilise `kubectl create secret`, SealedSecrets,
#     ou un gestionnaire externe (Vault, External Secrets Operator…).
#
# Équivalent en ligne de commande :
#   kubectl -n taskflow create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD='un-vrai-mot-de-passe'
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taskflow
type: Opaque
stringData: # stringData : valeurs en clair, encodées en base64 par l'API server
  POSTGRES_PASSWORD: change-me-in-prod
