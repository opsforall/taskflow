# Service HEADLESS (clusterIP: None) requis par le StatefulSet.
# « Headless » = pas d'IP virtuelle ni de load-balancing : le DNS renvoie
# directement l'IP du (des) pod(s). C'est ce dont un StatefulSet a besoin pour
# donner une identité réseau stable à chaque réplique.
# Le backend joint la base via ce nom DNS interne : postgres.taskflow.svc
# (ou simplement « postgres » dans le même namespace). La base n'est JAMAIS
# exposée hors du cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app: postgres
spec:
  clusterIP: None # ← headless
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
