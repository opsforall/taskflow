# Secrets du backend : mot de passe DB + clé de signature JWT.
# ⚠️  Committé uniquement pour la formation — voir la remarque dans 10-postgres-secret.yaml
#
# Équivalent CLI :
#   kubectl -n taskflow create secret generic backend-secret \
#     --from-literal=DB_PASSWORD='un-vrai-mot-de-passe' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: taskflow
type: Opaque
stringData:
  DB_PASSWORD: change-me-in-prod # doit correspondre à POSTGRES_PASSWORD (10-postgres-secret.yaml)
  JWT_SECRET: change-me-generate-a-random-64-char-string
