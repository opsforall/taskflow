# ==============================================================================
# Configuration SonarQube - projet TaskFlow (monorepo frontend + backend)
# ==============================================================================
# Lue par le scanner SonarQube lance depuis "Pipeline DevOps.yml" (job quality).
# ------------------------------------------------------------------------------

sonar.projectKey=taskflow
sonar.projectName=TaskFlow
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Sur SonarQube CLOUD uniquement, decommenter et renseigner l'organisation :
# sonar.organization=<votre-organisation>

# --- Perimetre analyse --------------------------------------------------------
# Code de production des deux composants.
sonar.sources=backend/src,frontend/src

# Les fichiers de test sont retires des SOURCES (sinon Sonar les juge comme du
# code de prod) et declares separement en TESTS.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx

sonar.tests=backend/tests,backend/tests-integration,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.test.exclusions=**/node_modules/**

# --- Couverture ---------------------------------------------------------------
# Rapports lcov produits par le job "test" (Jest cote backend, Vitest cote
# frontend) et remis a cet emplacement via les artefacts GitHub Actions.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
